[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
fs_permissions = [
  { access = "read-write", path = "./vectors" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fmt]
line_length = 120

[rpc_endpoints]
testnet = "${RPC_URL}"

[lint]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function", "mixed-case-variable"]
ignore = ["test/**/*.sol"]
